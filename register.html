<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SkillSwap</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">🔄 SkillSwap</a>
            <div class="nav-links" id="nav-links">
                <!-- JS will fill this based on login state -->
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="page-container">
        
        <!-- Registration Card Container -->
        <div class="form-card">
            <h2>Create Account</h2>
            <p class="subtitle">Join the skill swapping community</p>

            <!-- Feedback message containers (filled dynamically by JavaScript) -->
            <div class="error-message" id="error-message"></div>
            <div class="success-message" id="success-message"></div>

            <!-- Form handles student account creation -->
            <form id="register-form" onsubmit="handleRegister(event)">
                
                <!-- Full name field -->
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="e.g. John Doe" required>
                </div>

                <!-- Email field -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="e.g. john@college.edu" required>
                </div>

                <!-- College or university field -->
                <div class="form-group">
                    <label for="college">College / University</label>
                    <input type="text" id="college" placeholder="e.g. MIT" required>
                </div>

                <!-- Password field (minimum 6 characters) -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
                </div>

                <!-- Confirm password field for verification -->
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Re-enter password" required>
                </div>

                <!-- Submit button -->
                <button type="submit" class="btn btn-primary form-btn">Create Account</button>
            </form>

            <!-- Link to redirect existing users to login -->
            <p class="form-footer">Already have an account? <a href="login.html">Login</a></p>
        </div>

    </div>

    <!-- Link to external JavaScript file -->
    <script src="js/app.js"></script>
</body>
</html>
