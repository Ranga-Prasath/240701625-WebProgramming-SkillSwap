<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Skills - SkillSwap</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">🔄 SkillSwap</a>
            <div class="nav-links" id="nav-links">
                <!-- JS will fill this based on login state -->
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="page-container">
        
        <!-- Page Header -->
        <h1 style="text-align: center;">Browse Skills</h1>
        <p style="text-align: center; color: #777;">Explore skills taught by fellow college students and request a swap!</p>

        <!-- Search and Filter Bar -->
        <div class="search-bar">
            <!-- Text input to search by title, student name, or college -->
            <input type="text" id="search-input" placeholder="Search by skill, student, or college..." oninput="filterSkills()">

            <!-- Dropdown to filter skills by category -->
            <select id="category-filter" onchange="filterSkills()">
                <option value="All">All</option>
                <option value="Programming">Programming</option>
                <option value="Music">Music</option>
                <option value="Art">Art</option>
                <option value="Language">Language</option>
                <option value="Sports">Sports</option>
                <option value="Academic">Academic</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- Dynamic count display (e.g. "Showing 6 skills") -->
        <p id="skills-count" style="font-size: 14px; color: #888;"></p>

        <!-- Grid container populated dynamically with skill cards via JavaScript -->
        <div class="skills-grid" id="skills-grid">
            <!-- JS will populate this with skill cards -->
        </div>

        <!-- Empty state message displayed when no skills match the search/filter -->
        <div class="empty-state" id="empty-state" style="display: none;">
            <span class="emoji">📭</span>
            <p>No skills found. Try a different search!</p>
        </div>

    </div>

    <!-- Link to external JavaScript file -->
    <script src="js/app.js"></script>
</body>
</html>
