<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Swaps - SkillSwap</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">🔄 SkillSwap</a>
            <div class="nav-links" id="nav-links">
                <!-- JS will fill this based on login state -->
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="page-container">

        <!-- Page Header -->
        <h1 style="text-align: center;">My Swap Requests</h1>
        <p style="text-align: center; color: #777;">Manage your skill swap requests</p>

        <!-- Tabs Section: Toggle between received and sent requests -->
        <div class="tabs">
            <button class="tab-btn active" id="tab-received" onclick="loadSwaps('received')">Received Requests</button>
            <button class="tab-btn" id="tab-sent" onclick="loadSwaps('sent')">Sent Requests</button>
        </div>

        <!-- Container for swap cards (populated dynamically by JavaScript) -->
        <div id="swaps-container">
            <!-- JS will populate this with swap request cards -->
        </div>

        <!-- Empty state message displayed when there are no swap requests -->
        <div class="empty-state" id="empty-swaps" style="display: none;">
            <span class="emoji">📭</span>
            <p>No swap requests yet.</p>
            <a href="browse.html" class="btn btn-primary">Browse Skills</a>
        </div>

    </div>

    <!-- Link to external JavaScript file -->
    <script src="js/app.js"></script>
</body>
</html>
