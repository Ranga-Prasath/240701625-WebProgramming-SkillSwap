<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkillSwap</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">🔄 SkillSwap</a>
            <div class="nav-links" id="nav-links">
                <!-- JS will fill this based on login state -->
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="page-container">
        
        <!-- Login Card Container -->
        <div class="form-card">
            <h2>Student Login</h2>
            <p class="subtitle">Sign in to exchange skills with peers</p>
            
            <!-- Error message container (filled dynamically by JavaScript) -->
            <div class="error-message" id="error-message"></div>

            <!-- Form handles student authentication -->
            <form id="login-form" onsubmit="handleLogin(event)">
                
                <!-- Email field -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="e.g. alex@college.edu" required>
                </div>

                <!-- Password field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <!-- Submit button -->
                <button type="submit" class="btn btn-primary form-btn">Login</button>
            </form>

            <!-- Link to redirect new users to registration -->
            <p class="form-footer">Don't have an account? <a href="register.html">Sign Up</a></p>
        </div>

    </div>

    <!-- Link to external JavaScript file -->
    <script src="js/app.js"></script>
</body>
</html>
